services:
  app:
    build:
      context: .
      args:
        - PUBLIC_SUPABASE_URL
        - PUBLIC_SUPABASE_ANON_KEY
    ports: ["3000:3000"]
    environment:
      - SUPABASE_SERVICE_ROLE_KEY
      - ORIGIN 
    env_file:
      - .env.secretspec  # Dibuat otomatis oleh SecretSpec
    restart: unless-stopped
